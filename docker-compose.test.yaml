name: pr-assignment-test

services:
  app-test:
    build: .
    container_name: pr-assignment-test-app
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    depends_on:
      postgres-test:
        condition: service_healthy
    env_file:
      - .env.test
    healthcheck:
      test:
        ["CMD-SHELL", "wget --spider -q http://localhost:${PORT:-8000}/health"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 2s

  postgres-test:
    image: postgres:18.1-alpine3.22
    container_name: pr-assignment-test-db
    env_file:
      - .env.test
    volumes:
      - ./deployments/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 2s
